{% extends 'master/base.html' %}
{% load crispy_forms_tags %}
{% block title %}
  {{ page_title }}
{% endblock %}
{% block content %}
  <h1>{{ from_title }}</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form_data|crispy }}

    <button type="submit" class="btn btn-primary">{{ from_btn }}</button>
  </form>
{% endblock %}
